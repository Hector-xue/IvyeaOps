name: Release (prebuilt bundle)

# 打 tag（vX.Y.Z）或手动触发时：构建好前端 client/dist，打包成「已含前端的发行包」
# 并作为 GitHub Release 资产上传。普通用户下载它即可零构建安装（连 Node 都不用装）。

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '发布标签，例如 v1.0.0'
        required: true

permissions:
  contents: write

jobs:
  # 三个包（Linux/通用 zip、Windows exe、macOS .app）必须捆绑**同一个** IvyeaAgent 版本。
  #
  # 此前每个作业各自去问一次 GitHub API，各自带一句 `|| AGENT_REF=main` 的静默兜底。
  # v1.6.0 那次发版就露了馅：Linux 和 Windows 解析到 v1.10.3，macOS 的 curl 没成、
  # 悄悄回退到了 main。那次 main 恰好等于 v1.10.3，没造成差异 —— 但只要 main 领先于
  # 最新 tag 一步，同一个版本号的三个包里就会装着不同的 agent，且没有任何报错。
  #
  # 所以：解析一次，输出给所有人用；解析不出来就让发版失败，不猜。
  agent-ref:
    name: 确定要捆绑的 IvyeaAgent 版本
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.pick.outputs.ref }}
    steps:
      - name: 解析 ivyea-agent 的最新 release tag
        id: pick
        env:
          # 带上 token：匿名调 api.github.com 走的是**按 IP** 的限流，GitHub 托管 runner
          # 的出口 IP 是共享的，撞额度只是时间问题 —— macOS 那次多半就是这么失败的。
          GH_TOKEN: ${{ github.token }}
          OVERRIDE: ${{ vars.IVYEA_AGENT_REF }}
        run: |
          set -euo pipefail
          ref="${OVERRIDE:-}"
          if [ -n "$ref" ]; then
            echo "使用仓库变量 IVYEA_AGENT_REF 指定的版本：$ref"
          else
            for attempt in 1 2 3; do
              ref=$(curl -fsSL \
                      -H "Authorization: Bearer $GH_TOKEN" \
                      -H "Accept: application/vnd.github+json" \
                      "https://api.github.com/repos/Hector-xue/ivyea-agent/releases/latest" \
                    | python3 -c "import json,sys;print(json.load(sys.stdin).get('tag_name') or '')" 2>/dev/null) || ref=""
              [ -n "$ref" ] && break
              echo "第 $attempt 次没取到，5 秒后重试"
              sleep 5
            done
          fi
          if [ -z "$ref" ]; then
            echo "::error::取不到 ivyea-agent 的最新 release tag。这里**故意不回退到 main** ——"
            echo "::error::悄悄换成 main 会让发行包装上未发布的 agent 代码，而且三个平台的包可能各装各的。"
            echo "::error::要临时指定版本，请设仓库变量 IVYEA_AGENT_REF（如 v1.10.3）后重跑。"
            exit 1
          fi
          echo "bundling ivyea-agent ref: $ref"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

  build-and-release:
    runs-on: ubuntu-latest
    needs: agent-ref
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Python for Windows wheels
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build Windows backend wheelhouse
        run: |
          python -m pip install --upgrade pip wheel
          mkdir -p server/vendor/wheels
          REQ_WIN="$(mktemp)"
          python - <<'PY' > "$REQ_WIN"
          from pathlib import Path
          for line in Path('server/requirements.txt').read_text(encoding='utf-8').splitlines():
              # Cross-downloading uvicorn[standard] from Linux tries to resolve uvloop,
              # even though uvloop is not used on Windows. Download uvicorn itself and
              # append the Windows-compatible standard extras explicitly.
              if line.startswith('uvicorn[standard]'):
                  print(line.replace('uvicorn[standard]', 'uvicorn', 1))
              else:
                  print(line)
          print('# Windows-compatible uvicorn[standard] extras; uvloop is not used on Windows.')
          print('colorama>=0.4')
          print('httptools>=0.6')
          print('PyYAML>=5.1')
          print('watchfiles>=0.13')
          print('websockets>=10.4')
          PY
          # A couple of transitive dependencies are source-only on PyPI but pure
          # Python; build universal wheels for them so offline install stays wheel-only.
          python -m pip wheel --wheel-dir server/vendor/wheels docopt==0.6.2 sgmllib3k==1.0.0
          # Pre-download Windows x64 wheels so the Windows installer can install
          # backend deps offline / semi-offline. If users install from source or a
          # wheel is missing, scripts/install.ps1 falls back to normal online pip.
          python -m pip download \
            --dest server/vendor/wheels \
            --find-links server/vendor/wheels \
            --only-binary=:all: \
            --platform win_amd64 \
            --implementation cp \
            --python-version 312 \
            --abi cp312 \
            -r "$REQ_WIN"
          # requirements has a Python <3.10 compatibility marker; the bundled
          # wheelhouse targets the installer default Python 3.12, so that marker
          # is harmless if present in the cache.
          test -n "$(find server/vendor/wheels -maxdepth 1 -type f -name '*.whl' -print -quit)"
          du -sh server/vendor/wheels

      - name: Build frontend
        working-directory: client
        env:
          NODE_ENV: development   # 装 devDependencies（不用会触发部分 npm 版本崩溃的 --include=dev flag）
        run: |
          echo "node $(node -v), npm $(npm -v)"
          npm ci --no-audit --no-fund
          # 防御：node_modules 残缺则直接失败，避免后续 tsc 爆一堆 "Cannot find module 'react'"
          test -d node_modules/react && test -x node_modules/.bin/vite && test -x node_modules/.bin/tsc
          npm run build
          test -f dist/index.html

      - name: Resolve tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Package prebuilt bundle
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          printf '%s\n' "$TAG" > VERSION
          STAGE="staging/IvyeaOps"
          mkdir -p "$STAGE"
          # 复制整棵仓库（含刚构建出的 client/dist），排除开发/运行期产物。
          rsync -a \
            --exclude='.git' \
            --exclude='staging' \
            --exclude='client/node_modules' \
            --exclude='server/.venv' \
            --exclude='data' \
            --exclude='__pycache__' \
            --exclude='*.pyc' \
            --exclude='server/.env' \
            ./ "$STAGE/"
          test -f "$STAGE/client/dist/index.html"   # 确保预构建前端进了包
          # Ship IvyeaAgent source so install.sh / install-components.ps1 install it
          # OFFLINE from the bundle (no git/proxy failures at the user's end).
          # 版本由 agent-ref 作业统一解析（见文件顶部那段注释），三个平台的包共用同一个。
          AGENT_REF="${{ needs.agent-ref.outputs.ref }}"
          echo "bundling ivyea-agent ref: $AGENT_REF"
          # 克隆失败不再回退默认分支：那是同一个"悄悄换个版本"的坑，
          # 用户拿到的包会和版本号说的不是一回事。
          git clone --depth 1 --branch "$AGENT_REF" https://github.com/Hector-xue/ivyea-agent.git "$STAGE/agent"
          rm -rf "$STAGE/agent/.git"
          test -f "$STAGE/agent/pyproject.toml"   # bundled agent source present
          # 包里的 agent 自报版本必须和捆绑的 tag 一致。对不上时用户那边的表现是
          # 「有更新」徽标一直亮着且消不掉（agent 仓库为此吃过两次亏），这里挡住。
          BUNDLED=$(python3 -c "import re,pathlib;print(re.search(r'__version__ = \"([^\"]+)\"', pathlib.Path('$STAGE/agent/ivyea_agent/__init__.py').read_text(encoding='utf-8')).group(1))")
          echo "bundled IvyeaAgent $BUNDLED"
          [ "v$BUNDLED" = "$AGENT_REF" ] || {
            echo "::error::捆绑的 agent 自报 $BUNDLED，与 tag $AGENT_REF 不一致"; exit 1; }
          ( cd staging && zip -rq "../IvyeaOps-${TAG}.zip" IvyeaOps )
          cp "IvyeaOps-${TAG}.zip" "IvyeaOps.zip"   # 版本无关的稳定名，供 releases/latest/download 一键下载
          ls -lh "IvyeaOps-${TAG}.zip" "IvyeaOps.zip"

      - name: 从 CHANGELOG 取本版说明
        run: |
          set -euo pipefail
          TAG="${{ steps.tag.outputs.tag }}"
          # 取 `## [vX.Y.Z]` 到下一个 `## [` 之间那一段。**取不到就让发版失败**：
          # 一个没有"新增了什么、修复了什么"的 Release，对使用者等于没发。
          awk -v tag="$TAG" '
            $0 ~ "^## \\[" tag "\\]" { flag = 1; next }
            flag && /^## \[/ { exit }
            flag { print }
          ' CHANGELOG.md > CHANGELOG_SECTION.md
          if [ ! -s CHANGELOG_SECTION.md ]; then
            echo "::error::CHANGELOG.md 里没有 $TAG 这一节。发版前要把 Unreleased 改成本版号。"
            exit 1
          fi
          echo "取到 $(wc -l < CHANGELOG_SECTION.md) 行版本说明"

      - name: 拼出发版说明（本版改动 + 安装说明）
        run: |
          set -euo pipefail
          {
            cat CHANGELOG_SECTION.md
            echo
            echo "---"
            echo
            cat .github/release-body.md
          } > RELEASE_NOTES.md
          head -3 RELEASE_NOTES.md

      - name: Create / update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.tag }}
          generate_release_notes: true
          files: |
            IvyeaOps-${{ steps.tag.outputs.tag }}.zip
            IvyeaOps.zip
          body_path: RELEASE_NOTES.md
  build-windows-x64:
    name: Build Windows x64 exe bundle
    runs-on: windows-latest
    needs: [agent-ref, build-and-release]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build frontend
        working-directory: client
        env:
          NODE_ENV: development
        run: |
          npm ci --no-audit --no-fund
          npm run build
          if (!(Test-Path dist/index.html)) { throw "client/dist/index.html missing" }

      - name: Build backend exe
        shell: pwsh
        run: |
          python -m pip install --upgrade pip wheel pyinstaller
          python -m pip install -r server/requirements.txt
          # Bundle IvyeaAgent INTO the exe so the 免-Python package needs no
          # separate pip/Python/git install — the #1 deploy-failure source.
          # 版本由 agent-ref 作业统一解析（见文件顶部那段注释），三个平台的包共用同一个。
          $agentRef = "${{ needs.agent-ref.outputs.ref }}"
          Write-Host "bundling ivyea-agent ref: $agentRef"
          python -m pip install "git+https://github.com/Hector-xue/ivyea-agent.git@$agentRef"
          $bundled = python -c "import ivyea_agent; print(ivyea_agent.__version__)"
          Write-Host "bundling IvyeaAgent $bundled"
          # 自报版本必须和 tag 一致 —— 对不上时用户那边的表现是「有更新」徽标一直亮着
          # 且怎么更新都消不掉（agent 仓库为此吃过两次亏）。
          if ("v$bundled" -ne $agentRef) {
            Write-Host "::error::捆绑的 agent 自报 $bundled，与 tag $agentRef 不一致"
            exit 1
          }
          # Build the PyInstaller arg list. --collect-all winpty bundles pywinpty's
          # native ConPTY DLLs so the server-terminal board works in the frozen exe.
          # Best-effort: if winpty isn't importable, build without it (the terminal
          # then degrades gracefully) rather than failing the whole release.
          # --onedir (NOT --onefile): ship python3xx.dll + all deps permanently in
          # _internal\ next to the exe. onefile re-extracts ~81MB to %TEMP%\_MEI on
          # EVERY launch, and antivirus quarantining a DLL mid-extraction made the
          # exe fail with "Failed to load Python DLL ... _MEI\python312.dll 找不到
          # 指定的模块" right after the in-app updater relaunched it. onedir has no
          # launch-time extraction → no AV race, and starts faster.
          $piArgs = @("--noconfirm","--clean","--onedir","--windowed","--hidden-import","tkinter","--hidden-import","tkinter.messagebox")
          try { python -c "import winpty"; $piArgs += @("--collect-all","winpty"); Write-Host "bundling pywinpty (ConPTY)" }
          catch { Write-Host "winpty not importable; building without ConPTY bundle" }
          $piArgs += @("--collect-all","ivyea_agent","--collect-submodules","ivyea_agent")
          $piArgs += @("--icon","client/public/favicon.ico","--name","IvyeaOpsServer","--paths","server","server/ivyeaops_server.py")
          pyinstaller @piArgs
          if (!(Test-Path dist/IvyeaOpsServer/IvyeaOpsServer.exe)) { throw "IvyeaOpsServer.exe missing" }
          # Smoke: the exe must run the bundled agent serve from `agent-serve`.
          $p = Start-Process -FilePath "dist/IvyeaOpsServer/IvyeaOpsServer.exe" -ArgumentList "agent-serve","--host","127.0.0.1","--port","8799" -PassThru
          Start-Sleep -Seconds 12
          try { $r = Invoke-WebRequest -UseBasicParsing "http://127.0.0.1:8799/health" -TimeoutSec 5; Write-Host "bundled agent serve OK: $($r.Content)" }
          catch { $p | Stop-Process -Force; throw "bundled agent serve did not answer /health: $_" }
          $p | Stop-Process -Force

      - name: Resolve tag
        id: tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Package Windows x64 bundle
        shell: pwsh
        run: |
          $tag = "${{ steps.tag.outputs.tag }}"
          $stage = "staging/IvyeaOps"
          # NOTE: do NOT pre-create $stage/docs — `Copy-Item -Recurse docs "$stage/docs"`
          # into an existing dir nests it as docs/docs (the manual then 404s). Let
          # Copy-Item create it so docs land at $stage/docs/*.md.
          New-Item -ItemType Directory -Force -Path $stage, "$stage/server", "$stage/client", "$stage/scripts" | Out-Null
          Set-Content -Path "$stage/VERSION" -Value $tag -Encoding ascii
          # onedir: lay IvyeaOpsServer.exe + _internal\ at the bundle root (next to
          # server\, client\, …). sys.executable.parent then resolves to the bundle
          # root exactly as it did for onefile, so runtime_root()/path logic is unchanged.
          Copy-Item -Recurse dist/IvyeaOpsServer/* "$stage/"
          Copy-Item -Recurse client/dist "$stage/client/dist"
          Copy-Item -Recurse client/public "$stage/client/public"
          Copy-Item -Recurse docs "$stage/docs"
          # Skills are seeded into ~/.hermes/skills on startup (ASIN/广告审计、Listing
          # 板块依赖它们);the frozen exe reads them from next to itself, so they MUST
          # ship in the bundle — the frozen build does not embed them.
          Copy-Item -Recurse skills "$stage/skills"
          # amazon-image-workflow = the Docker 采集服务 (完整主图组). Ship the source so
          # the listing board's 「一键启动采集服务」 can find + `docker compose up` it.
          if (Test-Path amazon-image-workflow) { Copy-Item -Recurse amazon-image-workflow "$stage/amazon-image-workflow" }
          Copy-Item scripts/stop-hidden.ps1 "$stage/scripts/stop-hidden.ps1"
          Copy-Item scripts/install-components.ps1 "$stage/scripts/install-components.ps1"
          Copy-Item scripts/update-exe.ps1 "$stage/scripts/update-exe.ps1"
          Copy-Item scripts/windows-action-gui.ps1 "$stage/scripts/windows-action-gui.ps1"
          Copy-Item "停止 IvyeaOps.bat" "$stage/停止 IvyeaOps.bat"
          Copy-Item "更新 IvyeaOps Windows x64.bat" "$stage/更新 IvyeaOps Windows x64.bat"
          if (Test-Path README.md) { Copy-Item README.md "$stage/README.md" }
          Compress-Archive -Path staging/IvyeaOps -DestinationPath "IvyeaOps-Windows-x64-$tag.zip" -Force
          Copy-Item "IvyeaOps-Windows-x64-$tag.zip" "IvyeaOps-Windows-x64.zip"
          Get-ChildItem "IvyeaOps-Windows-x64-$tag.zip", "IvyeaOps-Windows-x64.zip" | Format-Table Name,Length

      - name: Upload Windows x64 bundle to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.tag }}
          files: |
            IvyeaOps-Windows-x64-${{ steps.tag.outputs.tag }}.zip
            IvyeaOps-Windows-x64.zip

  build-macos-app:
    name: Build macOS self-contained .app
    runs-on: macos-latest
    needs: [agent-ref, build-and-release]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build frontend
        working-directory: client
        env:
          NODE_ENV: development
        run: |
          npm ci --no-audit --no-fund
          npm run build
          test -f dist/index.html || { echo "client/dist/index.html missing"; exit 1; }

      - name: Build backend .app (PyInstaller --windowed, embeds Python)
        run: |
          python -m pip install --upgrade pip wheel pyinstaller
          python -m pip install -r server/requirements.txt
          # Bundle IvyeaAgent into the .app so it needs no separate install.
          # 版本由 agent-ref 作业统一解析（见文件顶部那段注释），三个平台的包共用同一个。
          # **这个作业就是 v1.6.0 那次悄悄回退到 main 的当事人**：它自己去问 API、
          # 失败了不吭声。现在它没有自己的解析逻辑，也就没有自己的兜底。
          AGENT_REF="${{ needs.agent-ref.outputs.ref }}"
          echo "bundling ivyea-agent ref: $AGENT_REF"
          python -m pip install "git+https://github.com/Hector-xue/ivyea-agent.git@${AGENT_REF}"
          BUNDLED=$(python -c "import ivyea_agent; print(ivyea_agent.__version__)")
          echo "bundling IvyeaAgent $BUNDLED"
          [ "v$BUNDLED" = "$AGENT_REF" ] || {
            echo "::error::捆绑的 agent 自报 $BUNDLED，与 tag $AGENT_REF 不一致"; exit 1; }
          python -c "import ivyea_agent; print('bundling IvyeaAgent', ivyea_agent.__version__)"
          # --windowed → a self-contained IvyeaOps.app (Python embedded, no install
          # needed). --onedir keeps deps in Contents/Frameworks (no per-launch extract,
          # mirrors the Windows x64 choice). Data dirs are copied into Contents/Resources
          # below; _runtime_root() resolves there on darwin.
          pyinstaller --noconfirm --clean --onedir --windowed \
            --collect-all ivyea_agent --collect-submodules ivyea_agent \
            --name IvyeaOps --paths server server/ivyeaops_server.py
          test -d "dist/IvyeaOps.app" || { echo "IvyeaOps.app missing"; exit 1; }
          # Smoke: the .app binary must run the bundled agent serve.
          "dist/IvyeaOps.app/Contents/MacOS/IvyeaOps" agent-serve --host 127.0.0.1 --port 8799 &
          SMOKE_PID=$!; sleep 12
          curl -fsS http://127.0.0.1:8799/health && echo " — bundled agent serve OK" || { kill $SMOKE_PID 2>/dev/null; echo "bundled agent serve failed"; exit 1; }
          kill $SMOKE_PID 2>/dev/null || true

      - name: Resolve tag
        id: tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Stage data into the .app + zip
        shell: bash
        run: |
          tag="${{ steps.tag.outputs.tag }}"
          res="dist/IvyeaOps.app/Contents/Resources"
          mkdir -p "$res/client"
          cp -R client/dist "$res/client/dist"
          cp -R client/public "$res/client/public"
          cp -R docs "$res/docs"
          cp -R skills "$res/skills"
          [ -d amazon-image-workflow ] && cp -R amazon-image-workflow "$res/amazon-image-workflow" || true
          echo "$tag" > "$res/VERSION"
          # zip the .app (ditto preserves the bundle bit + symlinks)
          ( cd dist && ditto -c -k --sequesterRsrc --keepParent "IvyeaOps.app" "../IvyeaOps-macOS-$tag.zip" )
          cp "IvyeaOps-macOS-$tag.zip" "IvyeaOps-macOS.zip"
          ls -lh IvyeaOps-macOS-*.zip

      - name: Upload macOS .app to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.tag }}
          files: |
            IvyeaOps-macOS-${{ steps.tag.outputs.tag }}.zip
            IvyeaOps-macOS.zip
