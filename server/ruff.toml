# IvyeaOps 后端 lint 门禁
#
# 选规则的原则：**门禁的价值在于不再劣化，不在于一次性把历史债清完。**
# 一上来就红几百条的门禁，第二天所有人就学会了无视它。所以这里只收录
# "当前全仓已经是零违规"的规则 —— 任何一条变红，都必然是这次改动引入的。
#
# 存量债（不进门禁，但记在这里，见优化方案 L0-2）：
#   E501   line-too-long          285 处（120 列口径）
#   BLE001 blind-except           455 处
#   S110   try-except-pass        187 处  ← 这条是"功能时好时坏说不清原因"的根
#   UP006/UP045 老式类型注解      1000+ 处（py3.9 兼容期内不动）
# 这四条按方案分批清理；清一批就把它移进下面的 select，从此不许回潮。

target-version = "py39"          # RHEL9/Debian11/Ubuntu20.04 的系统 Python
line-length = 120
extend-exclude = ["build", "dist", "data", ".venv", "node_modules", "*.bak.*"]

[lint]
select = [
    "F",     # pyflakes：未定义名、重复定义、未用导入 —— 真 bug 层
    "E9",    # 语法/IO 错误
    "T20",   # print：服务端诊断信息必须走 logger，否则自托管用户那边什么都留不下
    "G",     # logging 用 f-string（日志参数必须惰性求值）
    "C4",    # 多余的推导式/集合调用
    "B005",  # strip() 传多字符串 —— 按字符集剥离而非去前缀，是个会静默吃掉正文的坑
    "B018",  # 没有效果的表达式语句
]

ignore = [
    # 7 处"赋值了没用"的局部变量。其中几处看着像是漏接线的死计算
    # （listing/visuals.py 的 profile_anchors、ref_text），需要逐个人工判断
    # 是删掉还是补上使用方，不适合一刀切。先记账，不阻塞门禁。
    "F841",
]

[lint.per-file-ignores]
# 这两个是给人在终端里跑的 CLI 工具，print 就是它们的正确输出方式。
"app/core/hashpw.py" = ["T201"]
"app/services/freight_parser.py" = ["T201"]
# 测试里偶尔 print 调试是可接受的。
"tests/*" = ["T201"]
"app/tests/*" = ["T201"]
